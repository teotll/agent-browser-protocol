<!DOCTYPE html>
<html>
<head>
<title>ABP MCP Test Page</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  #input-field { width: 300px; padding: 8px; margin: 10px 0; }
  #click-target { width: 200px; height: 100px; background: #4CAF50; color: white;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border-radius: 8px; margin: 10px 0; }
  #click-count { margin: 10px 0; }
  #scroll-area { height: 2000px; background: linear-gradient(to bottom, #fff, #007bff); margin: 10px 0; }
  .section { margin: 20px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
</style>
</head>
<body>
<h1 id="title">ABP MCP Test Page</h1>

<div class="section">
  <h2>Click Test</h2>
  <div id="click-target" onclick="clickCount++; document.getElementById('click-count').textContent='Clicks: '+clickCount;">
    Click Me
  </div>
  <div id="click-count">Clicks: 0</div>
</div>

<div class="section">
  <h2>Input Test</h2>
  <input id="input-field" type="text" placeholder="Type here...">
  <div id="input-value"></div>
</div>

<div class="section">
  <h2>Dialog Test</h2>
  <button id="alert-btn" onclick="alert('Test alert message')">Show Alert</button>
  <button id="confirm-btn" onclick="document.getElementById('dialog-result').textContent='Confirm: '+confirm('Test confirm?')">Show Confirm</button>
  <button id="prompt-btn" onclick="document.getElementById('dialog-result').textContent='Prompt: '+prompt('Enter value:','default')">Show Prompt</button>
  <div id="dialog-result"></div>
</div>

<div class="section">
  <h2>Scroll Test</h2>
  <div id="scroll-area">
    <p>Top of scroll area</p>
    <p style="position:absolute;top:1000px;">Middle of scroll area</p>
    <p style="position:absolute;top:1900px;">Bottom of scroll area</p>
  </div>
</div>

<script>
var clickCount = 0;
document.getElementById('input-field').addEventListener('input', function(e) {
  document.getElementById('input-value').textContent = 'Value: ' + e.target.value;
});
</script>
</body>
</html>
